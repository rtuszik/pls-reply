[package]
name = "pls-reply"
version = "0.10.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "pls"
path = "src/main.rs"

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
toml = "1.0"
usage = { package = "usage-rs", version = "6" }

[target.'cfg(target_os = "linux")'.dependencies]
genai = "0.6.5"

[target.'cfg(not(target_os = "linux"))'.dependencies]
genai = { version = "0.6.5", default-features = false, features = ["native-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net"] }

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"
