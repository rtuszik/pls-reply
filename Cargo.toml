[package]
name = "pls-reply"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "pls"
path = "src/main.rs"

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
genai = "0.6.5"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }
toml = "1.0"

[profile.release]
opt-level = 3
strip = true
lto = true
