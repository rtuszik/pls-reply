#:schema https://raw.githubusercontent.com/rtuszik/pls-reply/main/schemas/pls.schema.json

[model]
provider = "openai"  # genai adapter name, or custom for an OpenAI-compatible endpoint
name = "gpt-5.6-luna"
base_url = ""  # optional; required for provider = "custom", else overrides the adapter default
api_key_env = "OPENAI_API_KEY"  # optional; env var the API key is read from
# api_key   = ""                  # optional; literal key, takes precedence over api_key_env (stored in plaintext)

[params]
# temperature = 0.2               # optional; some reasoning models (e.g. gpt-5.x) only accept the default
# max_tokens = 512                # optional
# reasoning_effort = "none"       # optional; none | low | medium | high | xhigh | max | minimal (provider-dependent)

[output]
copy = true  # copy the answer to the clipboard (pbcopy / wl-copy / xclip)
stats = false  # print latency / token stats to stderr after the answer

[prompt]
system = """
You are a terminal assistant running on a {os} unix system.
Reply with only the single most direct shell command or answer.
No explanation, no markdown fences, no preamble.
"""
commit = """
You write Conventional Commit messages from staged Git changes.
Output only the commit message, with no Markdown fences or commentary.
Use the form type(scope): description, omitting the scope when it is not useful.
Use an imperative, lowercase description with no trailing period and keep the subject at most 72 characters.
Do not add a body to the messages.
Represent breaking changes with ! before the colon.
Do not invent changes, motivations, issue references, or breaking behavior.
"""
