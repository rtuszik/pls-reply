---
name: Release

on:
    push:
        branches: [main]

concurrency:
    group: release-main
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            released: ${{ steps.plan.outputs.released }}
            version: ${{ steps.plan.outputs.version }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                persist-credentials: true
                fetch-depth: 0

            - name: Set up mise
              uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

            - name: Check Conventional Commits
              run: cog check

            - name: Determine whether a release is needed
              id: plan
              run: |
                target_tag="$(cog bump --auto --dry-run)"

                if [[ -z "$target_tag" ]]; then
                    echo "released=false" >> "$GITHUB_OUTPUT"
                    exit 0
                fi

                echo "released=true" >> "$GITHUB_OUTPUT"
                echo "tag=$target_tag" >> "$GITHUB_OUTPUT"
                echo "version=${target_tag#v}" >> "$GITHUB_OUTPUT"

            - name: Create version commit and tag
              if: steps.plan.outputs.released == 'true'
              run: |
                git config user.name github-actions[bot]
                git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                cog bump --auto --skip-ci

            - name: Push version commit and tag
              if: steps.plan.outputs.released == 'true'
              env:
                TAG: ${{ steps.plan.outputs.tag }}
              run: git push origin HEAD "refs/tags/$TAG"

            - name: Generate release notes
              if: steps.plan.outputs.released == 'true'
              env:
                TAG: ${{ steps.plan.outputs.tag }}
              run: cog changelog --at "$TAG" --template remote > "$RUNNER_TEMP/release-notes.md"

            - name: Create GitHub Release
              if: steps.plan.outputs.released == 'true'
              env:
                GH_TOKEN: ${{ github.token }}
                TAG: ${{ steps.plan.outputs.tag }}
              run: gh release create "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

    publish:
        needs: release
        if: needs.release.outputs.released == 'true'
        permissions:
            contents: write
        uses: ./.github/workflows/publish.yaml
        with:
            version: ${{ needs.release.outputs.version }}
