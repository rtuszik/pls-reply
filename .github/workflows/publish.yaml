---
name: Publish

on:
    workflow_call:
        inputs:
            version:
                description: Release Version without v prefix.
                required: true
                type: string

jobs:

    build:
        name: Build ${{ matrix.target }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write # upload release assets
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      os: ubuntu-latest
                    - target: aarch64-unknown-linux-gnu
                      os: ubuntu-24.04-arm
                    - target: aarch64-apple-darwin
                      os: macos-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
                ref: v${{ inputs.version }}

            - name: Set up mise toolchain
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                cache: false # clean, reproducible release build (avoids cache poisoning)

            - name: Build
              run: cargo build --release --locked

            - name: Package
              id: package
              env:
                TAG: v${{ inputs.version }}
                TARGET: ${{ matrix.target }}
              run: |
                archive="pls-${TAG}-${TARGET}.tar.gz"
                tar -czf "$archive" -C target/release pls
                echo "archive=$archive" >> "$GITHUB_OUTPUT"

            - name: Upload to release
              env:
                GH_TOKEN: ${{ github.token }}
                TAG: v${{ inputs.version }}
                ARCHIVE: ${{ steps.package.outputs.archive }}
              run: gh release upload "$TAG" "$ARCHIVE" --clobber
