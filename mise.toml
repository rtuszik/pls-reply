[tools]
"cargo:cargo-edit" = "latest"
cocogitto = "latest"
hyperfine = "latest"
opengrep = "latest"
prek = "latest"
rust = { version = "latest", components = ["rustfmt", "clippy"] }
tombi = "latest"
usage = "latest"
vhs = "latest"
zizmor = "latest"

[tasks.check]
depends = ["format", "lint", "tombi", "opengrep", "zizmor"]

[tasks.format]
description = "Format all Rust code with rustfmt"
run = "cargo fmt --all"

[tasks.lint]
description = "Lint with clippy, denying warnings"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.tombi]
description = "Lint TOML files and validate the example pls config against its schema"
run = [
  "tombi lint Cargo.toml mise.toml tombi.toml",
  "sed '1s|.*|#:schema ./schemas/pls.schema.json|' pls.example.toml | tombi lint --stdin-filename pls.example.toml -",
]

[tasks.opengrep]
description = "Static analysis with opengrep (fails on findings)"
run = "opengrep scan --config auto --error ."

[tasks.zizmor]
description = "Audit GitHub Actions workflows with zizmor"
run = "zizmor .github/workflows"

[tasks.bench]
description = "Benchmark pls with hyperfine"
run = ["cargo build --release --locked", "hyperfine --runs 10 --shell=none --show-output --input assets/benchmark-query.txt 'target/release/pls --no-copy'"]

[tasks.test]
description = "Run Rust tests"
run = "cargo test --all-features --locked"
